services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CDACDM_ARTIFACT_DIR: /app/artifacts
      EEDI_CONTENT_PATH: /app/content/eedi_questions.json
      EEDI_IMAGE_DIR: /app/content/images
      CALCULUS_ARTIFACT_DIR: /app/artifacts_calculus
      CALCULUS_IMAGE_DIR: /app/content/calculus_images
      EDUBRIDGE_DEFAULT_MODEL: ${EDUBRIDGE_DEFAULT_MODEL:-eedi_pdina}
    ports:
      # Keep the API private behind a reverse proxy (Caddy/Nginx).
      - "127.0.0.1:${EDUBRIDGE_PORT:-8000}:8000"
    volumes:
      # Mount authorized assessment content and local image assets read-only.
      - ./content:/app/content:ro
      # Optional second checkpoint; provide artifacts_calculus/model/* locally.
      - ./artifacts_calculus:/app/artifacts_calculus:ro
      # Persist local SQLite demo data outside the container.
      - ./data:/app/data
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.streamlit
    restart: unless-stopped
    env_file:
      - .env
    environment:
      EDUBRIDGE_API_URL: http://api:8000
      STREAMLIT_SERVER_HEADLESS: "true"
      STREAMLIT_BROWSER_GATHER_USAGE_STATS: "false"
    depends_on:
      api:
        condition: service_healthy
    ports:
      # Keep the admin/testing UI private behind a reverse proxy.
      - "127.0.0.1:${DASHBOARD_PORT:-8501}:8501"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
